[package]
name = "ez-jsonrpc"
version = "0.4.0"

description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ez-jsonrpc-types = { path = "types", version = "0.5.1" }
ez-jsonrpc-macros = { path = "macros", version = "0.1.1" }
ryu = "1.0.18"
serde = "1.0.205"
serde_json = "1.0.122"
tower-layer = "0.3.3"
tower-service = "0.3.3"
futures-util = { version = "0.3.31", default-features = false, features = [
    "async-await",
    "async-await-macro",
    "sink",
    "std",
] }
pin-project-lite = "0.2.15"
futures-channel = { version = "0.3.31", features = ["alloc"] }
either = { version = "1.13.0", default-features = false }

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/ez-jsonrpc"
repository = "https://github.com/aatifsyed/ez-jsonrpc"
homepage = "https://crates.io/crates/ez-jsonrpc"
description = "JSON-RPC 2.0 made easy!"

[dev-dependencies]
futures = "0.3.31"
tap = "1.0.1"

[workspace]
members = ["_doctest", "macros", "types"]
