[package]
name = "ez-jsonrpc-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
proc-macro = true

[dependencies]
darling = "0.20.10"
proc-macro2 = "1.0.86"
quote = { version = "1.0.36" }
syn = { version = "2.0.70", features = [
    "derive",
    "proc-macro",
], default-features = false }

[dev-dependencies]
ez-jsonrpc = { path = ".." }
